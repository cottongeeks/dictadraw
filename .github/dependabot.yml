version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 3
    # Majors stay in their own PRs, which are not merged automatically.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Dependency Upgrades owns routine npm bumps; a limit of 0 leaves Dependabot
  # opening only security update PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
